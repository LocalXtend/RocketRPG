<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RocketRPG 멀티</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; cursor: default; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
         background: #000; color: #cfcfcf; font: 16px "Malgun Gothic", "맑은 고딕", sans-serif; white-space: pre-line; padding: 20px; }
  #msg.show { display: flex; }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<audio id="a" autoplay></audio>
<div id="msg"></div>
<script>
"use strict";
// 멀티 방송 페이지 (RocketRPG 안의 WebView2에서만 쓰임)
//  방장: RocketRPG가 공유 메모리에 넣어 주는 게임 화면·소리를 트랙으로 만들어 참가자마다 WebRTC로 보냄
//  참가자: 방장에게서 받은 영상·소리를 재생
// RocketRPG ↔ 페이지는 chrome.webview 메시지, 연결 협상(signal)은 RocketRPG가 방 서버로 중계합니다.
const wv = window.chrome.webview;
const post = (m) => wv.postMessage(m);
const log = (...a) => post({ t: "log", text: a.map((x) => (x && x.message) || String(x)).join(" ") });
window.onerror = (m, s, l) => log("error", m, "line", l);
window.onunhandledrejection = (e) => log("rejection", e.reason);

const video = document.getElementById("v");
const audio = document.getElementById("a");
const msg = document.getElementById("msg");

let role = "", me = "", ice = [];
// TURN(중계 서버)은 쓰지 않습니다. 서로 다른 STUN 두 곳(둘 다 IPv6도 받음)에서 직접 연결 후보를 찾습니다.
// 멀티용 WebView2는 내부/가상 LAN(ZeroTier·Tailscale·Radmin VPN)/IPv6 주소를 그대로 후보로 냅니다
// (Chromium 기본값은 이 주소를 같은 공유기 안에서만 풀리는 xxx.local 이름으로 숨겨, 그런 길이 모두 막혔음).
const rtcConfig = () => ({ iceServers: [
  { urls: "stun:stun.cloudflare.com:3478" },
  { urls: "stun:stun.l.google.com:19302" }
], bundlePolicy: "max-bundle" });

// 내 네트워크 종류: STUN 두 곳이 본 내 바깥 포트가 서로 다르면 '대칭형 NAT'(직접 연결이 거의 안 됨).
//  "open" = 직접 연결 가능해 보임, "strict" = 대칭형 NAT, "noudp" = STUN에 닿지 않음(UDP 막힘), "" = 아직 모름
let myNat = "", natSent = "";
function judgeNat(srflx) {
  if (!srflx.length) return "noudp";
  const byBase = new Map();
  for (const c of srflx) {
    const base = (c.relatedAddress || "?") + ":" + (c.relatedPort || 0) + "/" + (c.address || "").includes(":");
    if (!byBase.has(base)) byBase.set(base, new Set());
    byBase.get(base).add(c.port);
  }
  for (const ports of byBase.values()) if (ports.size > 1) return "strict";
  return "open";
}
function setNat(nat) {
  if (!nat || nat === myNat) return;
  myNat = nat;
  if (nat !== natSent) { natSent = nat; post({ t: "nat", nat }); }
}
// 연결 후보 기록 (일반 로그에는 주소를 남기지 않음): 종류별 개수, 내부 주소가 .local로 숨겨졌는지, 네트워크 종류
function watchIce(pc) {
  const seen = {}, srflx = [];
  let mdns = 0;
  pc.addEventListener("icecandidate", (e) => {
    if (!e.candidate) return;
    const c = e.candidate;
    seen[c.type] = (seen[c.type] || 0) + 1;
    if (c.type === "host" && /\.local$/i.test(c.address || "")) mdns++;
    if (c.type === "srflx") srflx.push({ port: c.port, address: c.address || "", relatedAddress: c.relatedAddress || "", relatedPort: c.relatedPort || 0 });
  });
  // 701(주소 찾기 실패)은 IPv6가 없는 네트워크에서 늘 나오므로 적지 않음
  pc.addEventListener("icecandidateerror", (e) => { if (e.errorCode !== 701) log("ice error", e.url || "", e.errorCode, e.errorText || ""); });
  pc.addEventListener("icegatheringstatechange", () => {
    if (pc.iceGatheringState !== "complete") return;
    const nat = judgeNat(srflx);
    log("candidates", JSON.stringify(seen), "mdns:" + mdns, "nat:" + nat);
    setNat(nat);
  });
  pc.addEventListener("connectionstatechange", () => { if (pc.connectionState === "failed") log("failed with candidates", JSON.stringify(seen), "gathering", pc.iceGatheringState); });
  return pc;
}
const peers = new Map();                   // 방장: 참가자 id → { pc, pending }, 참가자: "host" → 방장 연결
const earlyIce = new Map();              // SDP보다 먼저 도착한 후보 (sid별, 최대 4회 연결)
let signalQueue = Promise.resolve();
function queueSignal(from, data) {
  signalQueue = signalQueue.then(() => role === "host" ? hostSignal(from, data) :
    role === "guest" && from === hostId ? guestSignal(from, data) : undefined)
    .catch((err) => log("signal", err));
}
let quality = { fps: 30, bitrate: 2000000 };

// ───────────── 방장: 공유 메모리 → 영상/소리 트랙 ─────────────
let shared = null, layout = null, hdr = null, lastSeq = 0, audioRead = 0;
// 영상과 소리를 다른 스트림으로 보냄: 같은 스트림이면 받는 쪽이 입을 맞추느라 영상을 소리만큼 늦춰(150ms 넘게) 게임 반응이 굼떠짐
let videoGen = null, videoWriter = null, audioGen = null, audioWriter = null, videoStream = null, audioStream = null;
let lastFrame = null, lastFrameAt = 0, pendingVideo = 0, audioTs = 0;

// 공유 메모리 구성은 MultiStreamer.cs 참고 (머리: 화면 번호, 칸, 폭, 높이, 소리 쓴 위치, 소리 고리 크기)
wv.addEventListener("sharedbufferreceived", (e) => {
  shared = e.getBuffer();
  layout = e.additionalData || null;
  hdr = new Int32Array(shared, 0, 8);
  lastSeq = hdr[0];
  audioRead = hdr[4] >>> 0;
});

function ensureTracks() {
  if (videoStream) return true;
  if (typeof MediaStreamTrackGenerator !== "function") { log("MediaStreamTrackGenerator unavailable"); return false; }
  videoGen = new MediaStreamTrackGenerator({ kind: "video" });
  audioGen = new MediaStreamTrackGenerator({ kind: "audio" });
  try { videoGen.contentHint = "motion"; } catch { }
  videoWriter = videoGen.writable.getWriter();
  audioWriter = audioGen.writable.getWriter();
  videoStream = new MediaStream([videoGen]);
  audioStream = new MediaStream([audioGen]);
  return true;
}

function writeVideo(frame) {
  if (pendingVideo > 2) { frame.close(); return; }   // 부호화가 밀리면 버림 (지연이 쌓이지 않게)
  pendingVideo++;
  videoWriter.write(frame).catch((e) => log("video write", e)).finally(() => pendingVideo--);
}

function pushFrame(slot, w, h) {
  if (!layout || slot < 0 || slot >= layout.slots || w <= 0 || h <= 0 || w * h * 4 > layout.slotBytes) return;
  const data = new Uint8Array(shared, layout.header + slot * layout.slotBytes, w * h * 4);
  const frame = new VideoFrame(data, { format: "BGRX", codedWidth: w, codedHeight: h, timestamp: Math.round(performance.now() * 1000) });
  if (lastFrame) lastFrame.close();
  lastFrame = frame.clone();
  lastFrameAt = performance.now();
  writeVideo(frame);
}

// 소리 고리에서 n프레임을 꺼내 소리 트랙에 씀 (끝에 닿으면 처음부터 이어 읽음)
function pushAudio(frames) {
  const ring = layout.audioFrames, at = audioRead % ring;
  const bytes = new Uint8Array(frames * 4);
  const first = Math.min(frames, ring - at);
  bytes.set(new Uint8Array(shared, layout.audioOffset + at * 4, first * 4));
  if (frames > first) bytes.set(new Uint8Array(shared, layout.audioOffset, (frames - first) * 4), first * 4);
  audioRead = (audioRead + frames) >>> 0;
  const now = performance.now() * 1000;
  if (Math.abs(audioTs - now) > 200000) audioTs = now;   // 소리가 끊겼다 다시 오면 시각을 다시 맞춤
  const data = new AudioData({ format: "s16", sampleRate: 48000, numberOfChannels: 2, numberOfFrames: frames, timestamp: Math.round(audioTs), data: bytes });
  audioTs += frames * 1e6 / 48000;
  audioWriter.write(data).catch((e) => log("audio write", e));
}

// 4ms마다 공유 메모리를 봄: 화면 번호가 바뀌었으면 새 그림, 소리는 10ms 넘게 쌓이면 보냄
setInterval(() => {
  if (role !== "host" || !hdr || !videoWriter) return;
  const seq = hdr[0];
  if (seq !== lastSeq) { lastSeq = seq; pushFrame(hdr[1], hdr[2], hdr[3]); }
  const written = hdr[4] >>> 0;
  let avail = (written - audioRead) >>> 0;
  if (avail > layout.audioFrames) { audioRead = (written - 4800) >>> 0; avail = 4800; }   // 많이 밀렸으면 최근 100ms만
  if (avail >= 480) pushAudio(Math.min(avail, 9600));
}, 4);

// 화면이 멈춰 있으면 새 프레임이 오지 않으므로, 막 들어온 참가자도 그림을 받도록 마지막 프레임을 가끔 다시 보냄
setInterval(() => {
  if (role !== "host" || !lastFrame || !peers.size || performance.now() - lastFrameAt < 900) return;
  lastFrameAt = performance.now();
  writeVideo(new VideoFrame(lastFrame, { timestamp: Math.round(lastFrameAt * 1000) }));
}, 300);

// Opus를 스테레오로 (게임 음악). 양쪽 SDP에 모두 적어야 스테레오로 오갑니다.
function stereo(sdp) {
  return sdp.replace(/a=fmtp:(\d+) ([^\r\n]*)/g, (line, pt, params) => {
    if (!new RegExp(`a=rtpmap:${pt} opus/`, "i").test(sdp) || /stereo=1/.test(params)) return line;
    return `a=fmtp:${pt} ${params};stereo=1;sprop-stereo=1;maxaveragebitrate=128000`;
  });
}

// 하드웨어 부호화가 흔한 H.264를 먼저 (없으면 VP8)
function preferH264(tr) {
  try {
    if (!tr.setCodecPreferences || !RTCRtpSender.getCapabilities) return;
    const rank = (c) => /h264/i.test(c.mimeType) ? (/packetization-mode=1/.test(c.sdpFmtpLine || "") ? 0 : 1) : /vp8/i.test(c.mimeType) ? 2 : 3;
    tr.setCodecPreferences(RTCRtpSender.getCapabilities("video").codecs.slice().sort((a, b) => rank(a) - rank(b)));
  } catch (e) { log("codec prefs", e); }
}

async function applyQuality(p) {
  for (const s of p.pc.getSenders()) {
    if (!s.track || s.track.kind !== "video") continue;
    const params = s.getParameters();
    if (!params.encodings || !params.encodings.length) continue;
    params.encodings[0].maxBitrate = quality.bitrate;
    params.encodings[0].maxFramerate = quality.fps;
    try { await s.setParameters(params); } catch (e) { log("setParameters", e); }
  }
}

let sidSeq = 0, lastCam = null;

function sendCam(m) {
  lastCam = JSON.stringify(m);
  for (const [, p] of peers) if (p.meta && p.meta.readyState === "open") { try { p.meta.send(lastCam); } catch { } }
}
const peerFails = new Map();   // 참가자 id → 이어서 실패한 횟수 (연결되면 0)
const peerNat = new Map();     // 참가자 id → 그 사람 네트워크 종류 (참가자가 알려 줌)
let blockedSent = "";

// 두 번 넘게 실패한 참가자를 RocketRPG에 알림 (참가자 목록에 '화면 연결 안 됨'과 어느 쪽이 막혔는지 표시)
function reportBlocked() {
  const ids = [...peerFails].filter(([, n]) => n >= 2).map(([id]) => id).sort();
  const why = {};
  for (const id of ids) why[id] = blockedSide(peerNat.get(id) || "", myNat);
  const key = JSON.stringify([ids, why]);
  if (key === blockedSent) return;
  blockedSent = key;
  post({ t: "peers", blocked: ids, why });
}

// 막힌 쪽: "me" = 이 PC 네트워크, "peer" = 상대 네트워크, "" = 모름
function blockedSide(peer, mine) {
  if (mine === "strict" || mine === "noudp") return "me";
  if (peer === "strict" || peer === "noudp") return "peer";
  return "";
}

function countFail(id, p) {
  if (p.counted) return;
  p.counted = true;
  peerFails.set(id, (peerFails.get(id) || 0) + 1);
  reportBlocked();
}

// 참가자가 연결을 청하면(want) 새로 만듦. 이전 연결은 닫고, 세션 번호(sid)로 늦게 온 옛 메시지를 걸러 냄.
async function hostPeer(id) {
  if (gated && !allowedIds.has(id)) { log("peer", id, "waits for the game check"); return; }
  if (!ensureTracks()) return;
  const old = peers.get(id);
  if (old) {
    if (old.pc.connectionState !== "connected") countFail(id, old);   // 끝나지 않은 채 다시 청함 = 실패
    old.pc.close();
  }
  const pc = watchIce(new RTCPeerConnection(rtcConfig()));
  const sid = ++sidSeq;
  const p = { pc, pending: [], sid };
  peers.set(id, p);
  // 카메라(핑 위치용)는 WebRTC 데이터 채널로: 서버를 거치지 않고, 늦은 것은 버림
  p.meta = pc.createDataChannel("meta", { ordered: false, maxRetransmits: 0 });
  p.meta.onopen = () => { if (lastCam) p.meta.send(lastCam); };
  // 조종 권한: 참가자 키 (순서대로, 빠짐없이). 참가자는 눌린 키 목록도 0.2초마다 보냄 → 빠진 떼기 보정, 끊기면 1초 뒤 모두 뗌
  p.input = pc.createDataChannel("input", { ordered: true });
  p.input.onmessage = (ev) => {
    try {
      const d = JSON.parse(ev.data);
      if (Array.isArray(d.s)) post({ t: "held", from: id, keys: d.s.filter(Number.isInteger).slice(0, 32) });
      else post({ t: "input", from: id, k: d.k, d: d.d, c: d.c || "", key: d.key || "" });
    } catch { }
  };
  p.input.onclose = () => post({ t: "inputclosed", from: id });
  // 노트 공유 (순서대로, 빠짐없이; 큰 것은 나눠서)
  p.notes = pc.createDataChannel("notes", { ordered: true });
  p.notes.onopen = () => post({ t: "nopen", from: id });
  p.notes.onmessage = (ev) => recvPart(id, ev.data);
  const vt = pc.addTransceiver(videoGen, { direction: "sendonly", streams: [videoStream] });
  pc.addTransceiver(audioGen, { direction: "sendonly", streams: [audioStream] });
  preferH264(vt);
  pc.onicecandidate = (e) => { if (e.candidate) post({ t: "signal", to: id, data: { ice: e.candidate.toJSON(), sid } }); };
  pc.onconnectionstatechange = () => {
    log("peer", id, pc.connectionState);
    if (pc.connectionState === "connected") { logRoute(id, pc); p.counted = false; peerFails.set(id, 0); reportBlocked(); }
    // 끊겨도 바로 닫지 않음: 참가자가 같은 연결로 다시 찾기(ICE 재시작)를 청하거나, 새 연결을 청함
    if (pc.connectionState === "failed" && peers.get(id) === p) countFail(id, p);
  };
  await sendOffer(id, p, false);
  await applyQuality(p);
}

async function sendOffer(id, p, restart) {
  const offer = await p.pc.createOffer(restart ? { iceRestart: true } : undefined);
  await p.pc.setLocalDescription({ type: "offer", sdp: stereo(offer.sdp) });
  post({ t: "signal", to: id, data: { sdp: p.pc.localDescription.toJSON(), sid: p.sid, nat: myNat } });
}

async function hostSignal(from, data) {
  if (typeof data.nat === "string") { peerNat.set(from, data.nat.slice(0, 8)); reportBlocked(); }
  if (data.want === "offer") { await hostPeer(from); return; }
  const p = peers.get(from);
  if (!p || data.sid !== p.sid) return;
  if (data.want === "restart") {
    // 같은 연결에서 길만 다시 찾음 (와이파이를 바꾸는 등 네트워크가 바뀐 뒤)
    if (p.pc.signalingState !== "stable") return;
    log("ice restart", from);
    p.pending = [];
    await sendOffer(from, p, true);
    return;
  }
  if (data.sdp && data.sdp.type === "answer") {
    if (p.pc.signalingState !== "have-local-offer") return;
    await p.pc.setRemoteDescription(data.sdp);
    for (const c of p.pending) await p.pc.addIceCandidate(c).catch(() => { });
    p.pending = [];
  } else if (data.ice) {
    if (!p.pc.remoteDescription || p.pc.signalingState !== "stable") p.pending.push(data.ice);
    else await p.pc.addIceCandidate(data.ice).catch((e) => log("ice", e));
  }
}

// 나간 참가자의 연결은 닫음 (새 참가자는 스스로 연결을 청함)
// gated = 방장이 스팀 게임 중: 게임 확인을 마친 참가자(ids)만 연결을 받음
let allowedIds = new Set(), gated = false;
function setMembers(ids, gate) {
  allowedIds = new Set(ids);
  gated = !!gate;
  for (const [id, p] of peers) if (!ids.includes(id)) { p.pc.close(); peers.delete(id); }
  for (const id of [...peerFails.keys()]) if (!ids.includes(id)) peerFails.delete(id);
  for (const id of [...peerNat.keys()]) if (!ids.includes(id)) peerNat.delete(id);
  reportBlocked();
}

// 연결 경로 기록 (내부망 직접/공인 주소 직접 등)
async function logRoute(id, pc) {
  try {
    const stats = await pc.getStats();
    let pair = null;
    stats.forEach((s) => { if (s.type === "transport" && s.selectedCandidatePairId) pair = stats.get(s.selectedCandidatePairId); });
    if (!pair) return;
    const l = stats.get(pair.localCandidateId), r = stats.get(pair.remoteCandidateId);
    log("route", id, l && l.candidateType, "->", r && r.candidateType, l && l.protocol);
  } catch { }
}

// 10초마다 방송 상태를 기록 (화질·소리 문제를 찾을 때 씀)
setInterval(async () => {
  for (const [id, p] of peers) {
    try {
      const stats = await p.pc.getStats();
      const codec = (s) => { const c = s.codecId && stats.get(s.codecId); return c ? c.mimeType.replace(/^\w+\//, "") : "?"; };
      stats.forEach((s) => {
        if (s.type === "outbound-rtp" && s.kind === "video" && s.frameWidth)
          log("send", id, codec(s), `${s.frameWidth}x${s.frameHeight}@${Math.round(s.framesPerSecond || 0)}`,
            `${Math.round((s.targetBitrate || 0) / 1000)}kbps`, "limit:" + (s.qualityLimitationReason || "none"));
        if (s.type === "outbound-rtp" && s.kind === "audio")
          log("send audio", id, codec(s), `${Math.round((s.bytesSent || 0) / 1024)}KB`);
        if (s.type === "inbound-rtp" && s.kind === "video")
          log("recv video", codec(s), `${s.frameWidth || 0}x${s.frameHeight || 0}@${Math.round(s.framesPerSecond || 0)}`,
            "lost:" + (s.packetsLost || 0), "jitterbuf:" + (s.jitterBufferEmittedCount ? Math.round(1000 * s.jitterBufferDelay / s.jitterBufferEmittedCount) : 0) + "ms");
        if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded" && s.currentRoundTripTime !== undefined)
          log("rtt", id, Math.round(s.currentRoundTripTime * 1000) + "ms");
        if (s.type === "inbound-rtp" && s.kind === "audio")
          log("recv audio", codec(s), "level:" + (s.audioLevel || 0).toFixed(3), "samples:" + (s.totalSamplesReceived || 0),
            "concealed:" + (s.concealedSamples || 0));
      });
    } catch { }
  }
}, 10000);

// ───────────── 참가자: 방장 영상 받기 ─────────────
let statusText = "", lastVideoAt = 0, hostId = "", attemptAt = -1e9, failCount = 0, linkSent = "", hostNat = "";
const NL = String.fromCharCode(10);
const VLAN_TIP = "ZeroTier·Tailscale·Radmin VPN 같은 가상 LAN을 방장과 같이 켜면 연결됩니다.";

// '막혀 있음' 안내: 어느 쪽 네트워크가 막는지 (STUN 두 곳에 보인 내 바깥 포트로 판단)
function blockedText() {
  const side = blockedSide(hostNat, myNat);
  const head = side === "me" ? "내 네트워크가 직접 연결을 막고 있는 것 같습니다 (휴대폰 테더링, 회사·학교·PC방 네트워크, VPN 등)."
    : side === "peer" ? "방장 네트워크가 직접 연결을 막고 있는 것 같습니다."
    : "네트워크가 직접 연결을 막고 있는 것 같습니다 (휴대폰 테더링, 회사·학교·PC방 네트워크, VPN 등).";
  return "방장과 연결되지 않습니다." + NL + head + NL + VLAN_TIP + NL + "연결될 때까지 계속 다시 시도합니다.";
}

function linkState() { const p = peers.get("host"); return p ? p.pc.connectionState : "none"; }

function wantOffer() {
  if (role !== "guest" || !hostId) return;
  attemptAt = performance.now();
  post({ t: "signal", to: hostId, data: { want: "offer", nat: myNat } });
}

// 같은 연결에서 길만 다시 찾기 (끊겼을 때 먼저 시도: 와이파이를 바꾸는 등 네트워크가 바뀐 뒤 다시 붙음)
function wantRestart(p) {
  attemptAt = performance.now();
  p.restarts = (p.restarts || 0) + 1;
  log("ask ice restart");
  post({ t: "signal", to: hostId, data: { want: "restart", sid: p.sid, nat: myNat } });
}

// 방장과의 직통 연결 지키기: 끊기면 먼저 길을 다시 찾고(ICE 재시작), 안 되면 새로 연결을 청함.
// 두 번 넘게 실패하면 '막혀 있음'을 보이고, 그 뒤로도 5초 → 10초 → 30초 간격으로 계속 시도해 네트워크가 나아지면 저절로 붙음.
setInterval(() => {
  if (role !== "guest" || !hostId) return;
  const p = peers.get("host");
  const st = linkState();
  if (st === "connected") { failCount = 0; if (p) p.restarts = 0; reportLink(); return; }
  const since = performance.now() - attemptAt;
  if (p && (st === "disconnected" || st === "failed") && (p.restarts || 0) < 1 && p.pc.signalingState === "stable") {
    if (st === "failed" || since > 3000) wantRestart(p);
    return;
  }
  const retry = failCount < 1 ? 5000 : failCount < 2 ? 10000 : 30000;
  // 연결 중(new/checking/connecting)이면 ICE 탐색을 너무 일찍 취소하지 않음
  const wait = st === "failed" || st === "closed" || st === "none" || st === "disconnected" ? retry : 35000;
  if (since < wait) return;
  if (attemptAt > 0) failCount++;
  reportLink();
  wantOffer();
}, 1000);

// 인터넷이 다시 잡히면 기다리지 않고 바로 시도
window.addEventListener("online", () => {
  if (role !== "guest" || linkState() === "connected") return;
  const p = peers.get("host");
  if (p && p.pc.signalingState === "stable" && (p.restarts || 0) < 1) wantRestart(p); else wantOffer();
});

// RocketRPG에 알림: 막힘/연결됨이 바뀔 때만
function reportLink() {
  const state = linkState() === "connected" ? "ok" : failCount >= 2 ? "blocked" : "trying";
  const side = state === "blocked" ? blockedSide(hostNat, myNat) : "";
  const key = state + "/" + side;
  if (key === linkSent || (state === "trying" && linkSent === "")) return;
  linkSent = key;
  post({ t: "link", state, side });
}

function lowLatency(receiver) {
  try { receiver.jitterBufferTarget = 0; } catch { }
  try { receiver.playoutDelayHint = 0; } catch { }
}

async function guestSignal(from, data) {
  let p = peers.get("host");
  if (typeof data.nat === "string") hostNat = data.nat.slice(0, 8);
  if (data.sdp && data.sdp.type === "offer" && p && p.sid === data.sid && p.pc.signalingState !== "closed") {
    // 같은 연결의 ICE 재시작: 영상·채널은 그대로 두고 길만 새로 찾음
    await p.pc.setRemoteDescription(data.sdp);
    for (const c of p.pending) await p.pc.addIceCandidate(c).catch(() => { });
    p.pending = [];
    const answer = await p.pc.createAnswer();
    await p.pc.setLocalDescription({ type: "answer", sdp: stereo(answer.sdp) });
    post({ t: "signal", to: from, data: { sdp: p.pc.localDescription.toJSON(), sid: p.sid, nat: myNat } });
    return;
  }
  if (data.sdp && data.sdp.type === "offer") {
    releaseAll();
    inputChannel = notesChannel = null;
    if (p) p.pc.close();
    const pc = watchIce(new RTCPeerConnection(rtcConfig()));
    const sid = data.sid;
    p = { pc, pending: earlyIce.get(sid) || [], sid };
    earlyIce.clear();
    peers.set("host", p);
    pc.ondatachannel = (e) => {
      if (e.channel.label === "input") { inputChannel = e.channel; return; }
      if (e.channel.label === "notes") { notesChannel = e.channel; notesChannel.onmessage = (ev) => recvPart("host", ev.data); return; }
      e.channel.onmessage = (ev) => { try { const d = JSON.parse(ev.data); if (d.t === "cam") post(d); } catch { } };
    };
    pc.ontrack = (e) => {
      lowLatency(e.receiver);
      const el = e.track.kind === "video" ? video : audio;
      const st = e.streams[0] || new MediaStream([e.track]);
      if (el.srcObject !== st) el.srcObject = st;
    };
    pc.onicecandidate = (e) => { if (e.candidate) post({ t: "signal", to: from, data: { ice: e.candidate.toJSON(), sid } }); };
    pc.onconnectionstatechange = () => { log("host link", pc.connectionState); if (pc.connectionState === "connected") logRoute("host", pc); };
    await pc.setRemoteDescription(data.sdp);
    for (const c of p.pending) await pc.addIceCandidate(c).catch(() => { });
    p.pending = [];
    const answer = await pc.createAnswer();
    await pc.setLocalDescription({ type: "answer", sdp: stereo(answer.sdp) });
    post({ t: "signal", to: from, data: { sdp: pc.localDescription.toJSON(), sid, nat: myNat } });
  } else if (data.ice) {
    if (!p || p.sid !== data.sid) {
      if (p && Number(data.sid) <= Number(p.sid)) return;
      if (!earlyIce.has(data.sid)) {
        if (earlyIce.size >= 4) earlyIce.delete(earlyIce.keys().next().value);
        earlyIce.set(data.sid, []);
      }
      const list = earlyIce.get(data.sid);
      if (list.length < 128) list.push(data.ice);
      return;
    }
    if (!p.pc.remoteDescription || p.pc.signalingState !== "stable") { p.pending.push(data.ice); return; }
    await p.pc.addIceCandidate(data.ice).catch((e) => log("ice", e));
  }
}

function onVideoFrame() {
  lastVideoAt = performance.now();
  video.requestVideoFrameCallback(onVideoFrame);
}
video.requestVideoFrameCallback(onVideoFrame);

// 안내 글: RocketRPG가 준 글(방장 없음 등)이 우선, 다음은 '막혀 있음', 영상이 3초 넘게 안 오면 "받는 중"
setInterval(() => {
  if (role !== "guest") { msg.classList.remove("show"); return; }
  const connected = linkState() === "connected";
  const text = statusText || (!connected && failCount >= 2 ? blockedText() : performance.now() - lastVideoAt > 3000 ? "방장 화면을 받는 중..." : "");
  msg.textContent = text;
  msg.classList.toggle("show", !!text);
}, 250);

// 참가자: 영상이 실제로 그려진 곳 (비율 맞춤으로 생긴 검은 띠 제외) → 채팅·핑 영역
let rectSent = "";
setInterval(() => {
  if (role !== "guest") return;
  const vw = video.videoWidth, vh = video.videoHeight, ew = video.clientWidth, eh = video.clientHeight;
  let r = { x: 0, y: 0, w: ew, h: eh };
  if (vw && vh && ew && eh) {
    const s = Math.min(ew / vw, eh / vh);
    r = { w: vw * s, h: vh * s, x: 0, y: 0 };
    r.x = (ew - r.w) / 2;
    r.y = (eh - r.h) / 2;
  }
  const key = [r.x, r.y, r.w, r.h].map(Math.round).join(",");
  if (key === rectSent) return;
  rectSent = key;
  post({ t: "vrect", x: r.x, y: r.y, w: r.w, h: r.h });
}, 300);

// ───────────── 참가자: 조종 권한 (키보드) ─────────────
// 방장이 켜면 이 화면에서 누른 게임 키를 방장에게 보냄. 창을 떠나거나 꺼지면 누르고 있던 키를 모두 뗌.
let controlOn = false, inputChannel = null;
const held = new Map();   // keyCode → { c, key }

function sendKey(k, down, c, key) {
  if (!inputChannel || inputChannel.readyState !== "open") return;
  try { inputChannel.send(JSON.stringify({ k, d: down ? 1 : 0, c: c || "", key: key || "" })); } catch { }
}

function releaseAll() {
  for (const [k, v] of held) sendKey(k, false, v.c, v.key);
  held.clear();
}

const isGameKey = (k) => k === 8 || k === 9 || k === 13 || k === 16 || k === 27 || k === 32 || (k >= 33 && k <= 40) ||
  (k >= 48 && k <= 57) || (k >= 65 && k <= 90) || (k >= 96 && k <= 123);

function trackKey(k, down, c, key) {
  if (down) { if (held.has(k)) return; held.set(k, { c, key }); }
  else { if (!held.has(k)) return; held.delete(k); }
  sendKey(k, down, c, key);
}

window.addEventListener("keydown", (e) => {
  if (role !== "guest" || !controlOn || e.ctrlKey || e.altKey || e.metaKey || !isGameKey(e.keyCode)) return;
  e.preventDefault();
  if (e.repeat) return;
  trackKey(e.keyCode, true, e.code, e.key);
}, true);
window.addEventListener("keyup", (e) => {
  if (role !== "guest" || !held.has(e.keyCode)) return;
  e.preventDefault();
  const v = held.get(e.keyCode);
  held.delete(e.keyCode);
  sendKey(e.keyCode, false, v.c, v.key);
}, true);
window.addEventListener("blur", releaseAll);
// 0.2초마다 지금 누르고 있는 키 목록: 방장이 빠진 떼기를 바로잡고, 이 목록이 1초 넘게 끊기면 내 키를 모두 뗌
setInterval(() => {
  if (role !== "guest" || !controlOn || !inputChannel || inputChannel.readyState !== "open") return;
  try { inputChannel.send(JSON.stringify({ s: [...held.keys()] })); } catch { }
}, 200);

// ───────────── 노트 공유: 큰 메시지는 나눠 보내고 받는 쪽에서 합침 ─────────────
let notesChannel = null;
const PART = 12000; // UTF-8로 최대 48KB: 한글/이모지도 SCTP 메시지 한도를 넘지 않음
const partsIn = new Map();

function queueSend(ch, str) {
  if (!ch || ch.readyState !== "open") return;
  const parts = [];
  if (str.length <= PART) parts.push(str);
  else {
    const id = Math.random().toString(36).slice(2);
    const n = Math.ceil(str.length / PART);
    for (let i = 0; i < n; i++) parts.push("\u0001" + JSON.stringify({ p: id, i, n }) + "\u0002" + str.slice(i * PART, (i + 1) * PART));
  }
  ch.__q = (ch.__q || []).concat(parts);
  pump(ch);
}

// 보내는 버퍼가 너무 차면(4MB) 비워질 때까지 기다림 (넘치면 채널이 닫힘)
function pump(ch) {
  while (ch.__q && ch.__q.length && ch.readyState === "open") {
    if (ch.bufferedAmount > (4 << 20)) {
      ch.bufferedAmountLowThreshold = 1 << 20;
      ch.onbufferedamountlow = () => pump(ch);
      return;
    }
    try { ch.send(ch.__q.shift()); } catch (e) { log("notes send", e); return; }
  }
}

function recvPart(from, data) {
  if (typeof data !== "string") return;
  if (data.charCodeAt(0) !== 1) { post({ t: "nrecv", from, data }); return; }
  const end = data.indexOf("\u0002");
  if (end < 2 || end > 256) return;
  let h;
  try { h = JSON.parse(data.slice(1, end)); } catch { return; }
  if (typeof h.p !== "string" || h.p.length > 64 || !Number.isInteger(h.n) || h.n < 1 || h.n > 1400 ||
      !Number.isInteger(h.i) || h.i < 0 || h.i >= h.n || data.length - end - 1 > PART) return;
  const now = performance.now();
  for (const [k, e] of partsIn) if (now - e.at > 30000) partsIn.delete(k);
  const key = from + ":" + h.p;
  let e = partsIn.get(key);
  if (!e) {
    if (partsIn.size >= 16) return;
    partsIn.set(key, e = { n: h.n, got: 0, parts: [], at: now });
  }
  if (e.n !== h.n) return;
  if (e.parts[h.i] === undefined) { e.parts[h.i] = data.slice(end + 1); e.got++; }
  if (e.got === e.n) { partsIn.delete(key); post({ t: "nrecv", from, data: e.parts.join("") }); }
}

// 참가자 스크린샷: 지금 보이는 방장 영상 한 장
function snapshot() {
  try {
    if (!video.videoWidth) return "";
    const c = document.createElement("canvas");
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext("2d").drawImage(video, 0, 0);
    return c.toDataURL("image/png").split(",")[1] || "";
  } catch { return ""; }
}

// ───────────── 공통 ─────────────
function closeAll() {
  releaseAll();
  inputChannel = null;
  notesChannel = null;
  partsIn.clear();
  earlyIce.clear();
  for (const [, p] of peers) p.pc.close();
  peers.clear();
  peerFails.clear();
  reportBlocked();
  failCount = 0;
  attemptAt = -1e9;
  linkSent = "";
  hostNat = "";
  video.srcObject = null;
  audio.srcObject = null;
  lastVideoAt = 0;
}

wv.addEventListener("message", (e) => {
  const m = e.data;
  try {
    switch (m.t) {
      case "init":
        if (m.role !== role || m.role === "guest") closeAll();
        role = m.role; me = m.me; ice = m.ice || []; hostId = m.host || "";
        if (role === "host") ensureTracks();
        if (role === "guest") wantOffer();
        break;
      case "host":   // 방장이 다시 접속해 id가 바뀜
        hostId = m.id || "";
        if (role === "guest" && !(peers.get("host") && peers.get("host").pc.connectionState === "connected")) wantOffer();
        break;
      case "members": if (role === "host") setMembers(m.ids || [], m.gate); break;
      case "retry":   // 참가자: 게임 확인이 끝나 바로 다시 연결을 청함
        if (role === "guest" && linkState() !== "connected") { failCount = 0; linkSent = ""; wantOffer(); }
        break;
      case "signal":
        queueSignal(m.from, m.data || {});
        break;
      case "quality":
        quality = { fps: m.fps, bitrate: m.bitrate };
        for (const [, p] of peers) applyQuality(p);
        break;
      case "status": statusText = m.text || ""; break;
      case "nsend":
        if (role === "host") {
          if (m.to === "*") { for (const [, p] of peers) queueSend(p.notes, m.data); }
          else { const p = peers.get(m.to); if (p) queueSend(p.notes, m.data); }
        } else queueSend(notesChannel, m.data);
        break;
      case "snap": post({ t: "snap", png: snapshot() }); break;
      case "control": controlOn = !!m.on; if (!controlOn) releaseAll(); break;
      case "key": if (role === "guest" && controlOn) trackKey(m.k, !!m.d, m.c, m.key); break;
      case "release": releaseAll(); break;
      case "cam": sendCam(m); break;   // 역할이 정해지기 전에 와도 기억해 두었다가 연결되면 보냄
      case "volume": audio.volume = Math.max(0, Math.min(1, m.value)); break;
    }
  } catch (err) { log("message", m && m.t, err); }
});

post({ t: "ready", generator: typeof MediaStreamTrackGenerator === "function", codecs: RTCRtpSender.getCapabilities ? RTCRtpSender.getCapabilities("video").codecs.map((c) => c.mimeType).filter((v, i, a) => a.indexOf(v) === i).join(",") : "" });
</script>
</body>
